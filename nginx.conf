server {
    listen 8000;
    server_name _;

    # Docs are mounted at /clearing-house/ (the baked BASE_PATH); the landing
    # app owns the domain root and reverse-proxies this path to the container.
    # The static build is copied into html/clearing-house, so `root` maps the
    # request path straight onto the files. URLs keep their .html suffix
    # (VitePress default), so try the exact file, then the .html form.
    location /clearing-house/ {
        root /usr/share/nginx/html;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Serve VitePress's 404 page, but with a real 404 status.
    error_page 404 /clearing-house/404.html;

    # Cache fingerprinted assets aggressively; they never change in place.
    location /clearing-house/assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
